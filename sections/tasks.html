<div class="vw active" id="v-tasks">
  <div class="flts" id="tFlts"></div>
  <div class="ntbar">
    <button class="nbtn" id="ntTgl">+ NEW TASK</button>
    <div class="tfrm" id="tFrm">
      <div class="fr" style="grid-template-columns:1fr"><div><label class="fl">Task Name</label><input type="text" class="fi" id="fN" placeholder="E.G., SEND DCP SPECS TO FILMS BOUTIQUE" style="text-transform:uppercase"></div></div>
      <div class="fr fr2">
        <div><label class="fl">Project</label><select class="fs" id="fP"></select></div>
        <div><label class="fl">Priority</label><select class="fs" id="fPr"><option value="1">1 — URGENT</option><option value="2">2 — HIGH</option><option value="3" selected>3 — NORMAL</option><option value="4">4 — LOW</option><option value="5">5 — MINIMAL</option></select></div>
      </div>
      <div class="fr fr3">
        <div><label class="fl">Due Date</label><div style="display:flex;gap:4px;align-items:center"><input type="hidden" id="fDu"><div class="cal-wrap" style="flex:1"><button type="button" class="fi" id="fDuCal" style="text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%"><span style="opacity:.5">📅</span><span id="fDuLabel" style="flex:1">—</span></button><div class="cal-pop" id="fDuCalPop"></div></div><button type="button" class="setnow-b" id="fDuToday" style="white-space:nowrap;padding:8px 10px">TODAY</button><button type="button" class="setnow-b" id="fDuClear" style="white-space:nowrap;padding:8px 10px;color:var(--t3)">✕</button></div></div>
        <div class="sug-w"><label class="fl">Blocked By</label><input type="text" class="fi" id="fBl" placeholder="Leave empty" autocomplete="off"><div class="sug-l" id="sugBl"></div></div>
        <div><label class="fl">Notes</label><input type="text" class="fi" id="fNo" placeholder="Optional..."></div>
      </div>
      <div class="fac"><button class="btn btn-gh" id="cTask">CANCEL</button><button class="btn btn-g" id="sTask">CREATE TASK</button></div>
    </div>
  </div>
  <div id="tList" class="kb-board"></div>
  <div class="csec">
    <div class="chdr"><div class="ctgl" id="cTgl"><span class="ch">▶</span><h3>COMPLETED (<span id="cCnt">0</span>)</h3></div><div style="display:flex;gap:6px"><button class="edb" id="edBtn">☀ END DAY</button><button class="edb" id="clrArchBtn" style="background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25);color:var(--red)">✕ CLEAR ALL</button></div></div>
    <div class="clist" id="cList"></div>
  </div>
</div>
