<!-- Edit Grocery Modal -->
<div class="mbg" id="egMdl"><div class="mdl"><h3>✎ Edit Grocery Item</h3>
  <div class="fg"><label class="fl">Item Name</label><input type="text" class="fi" id="egN" style="text-transform:uppercase"></div>
  <div class="fr fr3">
    <div class="fg"><label class="fl">Location</label><div style="display:flex;gap:4px"><select class="fs" id="egLoc" style="flex:1"></select><input type="text" class="fi" id="egLocNew" placeholder="Or type new..." style="flex:1;text-transform:uppercase"></div></div>
    <div class="fg"><label class="fl">Typical Price</label><input type="number" class="fi" id="egPrice" placeholder="0.00" step="0.01" min="0"></div>
    <div class="fg tgl-row" style="padding-top:18px"><label class="tgl-sw"><input type="checkbox" id="egRefill"><span class="tgl-sl"></span></label><span class="tgl-lb">Needs Refill</span></div>
  </div>
  <div class="fr fr2">
    <div class="fg"><label class="fl">Last Purchased</label><div style="display:flex;gap:4px;align-items:center"><input type="date" class="fi" id="egLP"><button type="button" class="setnow-b" id="egLPToday">TODAY</button><button type="button" class="setnow-b" id="egLPClear" style="color:var(--t3)">✕</button></div></div>
    <div class="fg"><label class="fl">Notes</label><input type="text" class="fi" id="egNo"></div>
  </div>
  <div class="mdla"><button class="btn btn-r" id="egDel" style="margin-right:auto">DELETE</button><button class="btn btn-gh" id="egC">CANCEL</button><button class="btn btn-g" id="egS">SAVE</button></div>
</div></div>
