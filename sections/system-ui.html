<div class="toast" id="toast"></div>
<!-- Cloud Sync UI -->
<div class="sync-indicator" id="syncInd"><span class="sync-dot"></span><span id="syncTxt">SYNCED</span></div>
<button class="sync-btn" id="syncBtn" title="Sync from cloud">⟳</button>
<div class="loading-overlay" id="loadOv">
  <div class="q-progress-bar"><div class="q-progress-fill" id="qFill"></div></div>
  <div class="q-body">
    <span class="q-deco open">&ldquo;</span>
    <div class="q-text" id="qText"></div>
    <span class="q-deco close">&rdquo;</span>
    <div class="q-author" id="qAuthor"></div>
  </div>
  <div class="q-footer">
    <button class="q-skip" id="qSkip">SKIP →</button>
  </div>
</div>
