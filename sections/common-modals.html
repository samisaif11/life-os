<!-- Block Modal -->
<div class="mbg" id="bMdl"><div class="mdl"><h3>🔒 Mark as Blocked</h3><div class="fg sug-w"><label class="fl">Blocked by</label><input type="text" class="fi" id="blInp" placeholder="E.G., CANAL+" autocomplete="off"><div class="sug-l" id="sugBlM"></div></div><div class="mdla"><button class="btn btn-gh" id="cBl">CANCEL</button><button class="btn btn-r" id="cfBl">MARK BLOCKED</button></div></div></div>

<!-- Edit Task Modal -->
<div class="mbg" id="eMdl"><div class="mdl"><h3>✎ Edit Task</h3>
  <div class="fg"><label class="fl">Task Name</label><input type="text" class="fi" id="eN" style="text-transform:uppercase"></div>
  <div class="fr fr2"><div class="fg"><label class="fl">Project</label><select class="fs" id="eP"></select></div><div class="fg"><label class="fl">Priority</label><select class="fs" id="ePr"><option value="1">1-URGENT</option><option value="2">2-HIGH</option><option value="3">3-NORMAL</option><option value="4">4-LOW</option><option value="5">5-MINIMAL</option></select></div></div>
  <div class="fr fr2"><div class="fg"><label class="fl">Due Date</label><div style="display:flex;gap:4px;align-items:center"><input type="hidden" id="eDu"><div class="cal-wrap" style="flex:1"><button type="button" class="fi" id="eDuCal" style="text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%"><span style="opacity:.5">📅</span><span id="eDuLabel" style="flex:1">—</span></button><div class="cal-pop" id="eDuCalPop"></div></div><button type="button" class="setnow-b" id="eDuToday" style="white-space:nowrap;padding:8px 10px">TODAY</button><button type="button" class="setnow-b" id="eDuClear" style="white-space:nowrap;padding:8px 10px;color:var(--t3)">✕</button></div></div><div class="fg"><label class="fl">Notes</label><input type="text" class="fi" id="eNo"></div></div>
  <div class="mdla"><button class="btn btn-r" id="eTDel" style="margin-right:auto">DELETE</button><button class="btn btn-gh" id="eTC">CANCEL</button><button class="btn btn-g" id="eTS">SAVE</button></div></div></div>

<!-- Edit Deadline Modal -->
<div class="mbg" id="edMdl"><div class="mdl"><h3>✎ Edit Deadline</h3>
  <div class="fg"><label class="fl">Description</label><input type="text" class="fi" id="edT"></div>
  <div class="fr fr4"><div class="fg"><label class="fl">Project</label><select class="fs" id="edP"></select></div><div class="fg"><label class="fl">Date</label><div style="display:flex;gap:4px;align-items:center"><input type="hidden" id="edDate"><div class="cal-wrap" style="flex:1"><button type="button" class="fi" id="edDateCal" style="text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%"><span style="opacity:.5">📅</span><span id="edDateLabel" style="flex:1">—</span></button><div class="cal-pop" id="edDateCalPop"></div></div><button type="button" class="setnow-b" id="edDateToday" style="white-space:nowrap;padding:8px 10px">TODAY</button></div></div><div class="fg"><label class="fl">Time</label><input type="time" class="fi" id="edTime"></div><div class="fg sug-w"><label class="fl">Partner</label><input type="text" class="fi" id="edPa" autocomplete="off"><div class="sug-l" id="sugEdPa"></div></div></div>
  <div class="fr fr4"><div class="fg"><label class="fl">Type</label><select class="fs" id="edTy"><option value="hard">HARD</option><option value="soft">SOFT</option></select></div><div class="fg sug-w"><label class="fl">Person</label><input type="text" class="fi" id="edPe" autocomplete="off" placeholder="Type..."><div class="sug-l" id="sugEdPe"></div></div><div class="fg tgl-row"><label class="tgl-sw"><input type="checkbox" id="edAD"><span class="tgl-sl"></span></label><span class="tgl-lb">All-Day</span></div><div class="fg tgl-row"><label class="tgl-sw"><input type="checkbox" id="edKC"><span class="tgl-sl"></span></label><span class="tgl-lb">Keep Counting</span></div></div>
  <div class="fg"><label class="fl">Notes</label><input type="text" class="fi" id="edNo" placeholder="Optional..."></div>
  <div class="mdla"><button class="btn btn-r" id="edDDel" style="margin-right:auto">DELETE</button><button class="btn btn-gh" id="edDC">CANCEL</button><button class="btn btn-g" id="edDS">SAVE</button></div></div></div>

<!-- Edit Person Modal -->
<div class="mbg" id="epMdl"><div class="mdl"><h3>✎ Edit Person</h3>
  <div class="fr fr2"><div class="fg"><label class="fl">Code</label><input type="text" class="fi" id="epCd"></div><div class="fg"><label class="fl">Color</label><input type="color" class="clr-i" id="epPClr" style="width:100%;height:34px" value="#60a5fa"></div></div>
  <div class="fg"><label class="fl">Full Name</label><input type="text" class="fi" id="epNm"></div>
  <div class="fg"><label class="fl">Role</label><input type="text" class="fi" id="epRl"></div>
  <div class="mdla"><button class="btn btn-gh" id="epCn">CANCEL</button><button class="btn btn-g" id="epSv">SAVE</button></div></div></div>

<!-- Edit Partner Modal -->
<div class="mbg" id="eprMdl"><div class="mdl"><h3>✎ Edit Partner</h3>
  <div class="fg"><label class="fl">Name/Code</label><input type="text" class="fi" id="eprNm"></div>
  <div class="fr fr2"><div class="fg"><label class="fl">Text Color</label><input type="color" class="clr-i" id="eprFg" style="width:100%;height:34px"></div><div class="fg"><label class="fl">BG</label><input type="color" class="clr-i" id="eprBg" style="width:100%;height:34px"></div></div>
  <div class="mdla"><button class="btn btn-gh" id="eprCn">CANCEL</button><button class="btn btn-g" id="eprSv">SAVE</button></div></div></div>

<!-- Edit Project Modal -->
<div class="mbg" id="ePrjMdl"><div class="mdl"><h3>✎ Edit Project</h3>
  <div class="fr fr2"><div class="fg"><label class="fl">Title</label><input type="text" class="fi" id="epN"></div><div class="fg"><label class="fl">Code</label><input type="text" class="fi" id="epCd2" placeholder="e.g. CMÁ" maxlength="8"></div></div>
  <div class="fr fr3"><div class="fg"><label class="fl">Accent Color</label><input type="color" class="clr-i" id="epClr" style="width:100%;height:34px" value="#d4af37"></div><div class="fg"><label class="fl">Category</label><select class="fs" id="epCat"><option value="film">FILM</option><option value="personal">PERSONAL</option></select></div><div class="fg"><label class="fl">Status</label><select class="fs" id="epStat"></select></div></div>
  <div class="fr fr2" id="epFilmFields"><div class="fg"><label class="fl">Type</label><select class="fs" id="epTyp"><option value="Feature Film">Feature Film</option><option value="Feature Documentary">Feature Documentary</option><option value="Short Fiction">Short Fiction</option><option value="Short Documentary">Short Documentary</option></select></div><div></div></div>
  <div class="fg"><label class="fl">Poster</label>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="position:relative;flex-shrink:0">
        <div class="poster-prev" id="epPosterPrev"><div class="poster-prev-ph">No Poster</div></div>
        <button type="button" class="btn" id="epPosterDel" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;padding:0;font-size:.65rem;border-radius:50%;background:var(--rd);color:#fff;display:none;line-height:20px;text-align:center;cursor:pointer" title="Remove poster">✕</button>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <input type="url" class="fi" id="epPosterUrl" placeholder="Paste image URL">
        <input type="file" class="fi" id="epPosterFile" accept="image/*" style="padding:6px 8px;font-size:.68rem">
      </div>
    </div>
  </div>
  <div class="mdla" style="justify-content:space-between"><button class="btn" id="ePrjDel" style="background:var(--red-d);color:var(--red);border:1px solid rgba(239,68,68,.25)">🗑 DELETE</button><div style="display:flex;gap:8px"><button class="btn btn-gh" id="ePrjCn">CANCEL</button><button class="btn btn-g" id="ePrjSv">SAVE</button></div></div>
</div></div>
