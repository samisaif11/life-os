<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restore Data from Excel Backup</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #0a0a0b;
            color: #fff;
        }
        .container {
            background: #1a1a1f;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #2a2a2f;
        }
        h1 {
            color: #d4af37;
            margin-top: 0;
        }
        .step {
            margin: 20px 0;
            padding: 15px;
            background: #0a0a0b;
            border-left: 3px solid #d4af37;
        }
        .step-num {
            color: #d4af37;
            font-weight: bold;
            margin-right: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0a0a0b;
            border: 1px solid #2a2a2f;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #666;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #e4bf47;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            display: none;
        }
        .status.success {
            background: #0a3a0a;
            border: 1px solid #4a4;
            color: #4a4;
            display: block;
        }
        .status.error {
            background: #3a0a0a;
            border: 1px solid #a44;
            color: #a44;
            display: block;
        }
        .status.loading {
            background: #0a3a3a;
            border: 1px solid #4aa;
            color: #4aa;
            display: block;
        }
        .code {
            background: #0a0a0b;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Restore Data Backup</h1>

        <p>Your Excel backup will be restored to Google Sheets in one click.</p>

        <div class="step">
            <span class="step-num">1️⃣</span>
            <strong>Paste your Apps Script Deployment URL</strong>
            <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/d/ABC123.../usercallback" />
            <small style="color: #999;">Find this in your Apps Script: Deploy → View URL</small>
        </div>

        <div class="step">
            <span class="step-num">2️⃣</span>
            <strong>Click to restore</strong>
            <button onclick="restoreData()">Restore All Data Now</button>
            <small style="color: #999;">This will read your Excel backup and restore all 15 sheets</small>
        </div>

        <div id="status" class="status"></div>

        <div id="result"></div>
    </div>

    <script>
        async function restoreData() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const statusDiv = document.getElementById('status');

            if (!apiUrl) {
                showStatus('❌ Please paste your Apps Script URL first', 'error');
                return;
            }

            showStatus('⏳ Reading Excel backup...', 'loading');

            try {
                // Step 1: Extract Excel data
                const excelData = await extractExcelData();

                showStatus('📤 Uploading to Google Sheets...', 'loading');

                // Step 2: Call Apps Script to restore
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'restoreFromBackup',
                        data: excelData
                    })
                });

                const result = await response.json();

                if (result.success || result.message) {
                    showStatus(
                        '✅ Success! Data restored to Google Sheets\n\n' +
                        'Sheets restored: ' + Object.keys(excelData).join(', ') +
                        '\n\nRefresh your Google Sheet to see the data.',
                        'success'
                    );
                } else {
                    showStatus('❌ ' + (result.error || 'Restore failed'), 'error');
                }
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }

        async function extractExcelData() {
            // This is a simplified version that would need the actual Python backend
            // For now, return a message
            alert('Excel extraction requires Python backend.\n\nUse the simpler method:\n1. Open PIĀNKY - Life OS (1).xlsx\n2. Copy each sheet\n3. Paste into Google Sheets\n\nOr run: python3 restore_backup.py');
            throw new Error('Use Python script instead');
        }

        function showStatus(message, type) {
            const div = document.getElementById('status');
            div.textContent = message;
            div.className = 'status ' + type;
        }
    </script>
</body>
</html>
