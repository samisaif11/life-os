<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMI'S Life OS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png">
<link rel="apple-touch-icon" href="assets/images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div data-include="sections/header.html"></div>

<div class="main">
  <div data-include="sections/tasks.html"></div>
  <div data-include="sections/deadlines.html"></div>
  <div data-include="sections/projects.html"></div>
  <div data-include="sections/books.html"></div>
  <div data-include="sections/finance.html"></div>
  <div data-include="sections/health.html"></div>
</div>

<div data-include="sections/health-modals.html"></div>
<div data-include="sections/books-modals.html"></div>
<div data-include="sections/grocery-modal.html"></div>
<div data-include="sections/settings.html"></div>
<div data-include="sections/common-modals.html"></div>
<div data-include="sections/system-ui.html"></div>

<script>
(function () {
  const includes = Array.from(document.querySelectorAll('[data-include]'));
  const loadInclude = async (node) => {
    const path = node.getAttribute('data-include');
    const response = await fetch(path);
    if (!response.ok) throw new Error(`${path}: ${response.status}`);
    node.outerHTML = await response.text();
  };
  const loadApp = () => {
    const script = document.createElement('script');
    script.src = 'assets/js/app.js';
    script.defer = true;
    document.body.appendChild(script);
  };
  Promise.all(includes.map(loadInclude))
    .then(loadApp)
    .catch((error) => {
      document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#f0eeea;background:#060608;min-height:100vh"><h1>Life OS failed to load</h1><p>Could not load one of the HTML sections. Serve this repository through a local web server or GitHub Pages instead of opening index.html directly.</p><pre style="white-space:pre-wrap;color:#ef4444"></pre></div>';
      document.querySelector('pre').textContent = error.message;
      console.error(error);
    });
})();
</script>
</body>
</html>
